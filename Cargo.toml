[workspace]
resolver = "2"
members = [
    "crates/entity",
    "crates/migration",
    "crates/credit_risk_hmm_engine",
    "crates/credit_risk",
    "crates/spectral_hypergraph",
    "crates/ontology_engine",
    "crates/credit_network",
    "crates/api",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = true
