[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "loan-risk-api"
path = "src/main.rs"

[dependencies]
entity = { path = "../entity" }
migration = { path = "../migration" }
credit_risk = { path = "../credit_risk" }
credit_network = { path = "../credit_network" }

axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
sea-orm = { version = "0.12", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-uuid", "with-json", "with-rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
anyhow = "1"
