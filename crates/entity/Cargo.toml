[package]
name = "entity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
sea-orm = { version = "0.12", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-uuid", "with-json", "with-rust_decimal"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
