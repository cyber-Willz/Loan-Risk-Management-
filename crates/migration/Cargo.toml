[package]
name = "migration"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"

[dependencies]
sea-orm-migration = { version = "0.12", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
